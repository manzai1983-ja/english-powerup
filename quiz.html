<div class="wrap">
<header>
  <h1>Unknown 英作文ドリル</h1>
  <p>ラジオ英会話の Unknown words/phrases から出題します。日本語を見て、<b>英語を自分で書くか🎤で言って</b>ください。
     間違えたものほどよく出ます。<a href="idioms.html">イディオム例文集</a> · <a href="./">聞き取れなかった英文</a></p>
</header>

  </select>
  <select id="mode" aria-label="出し方">
    <option value="auto">おまかせ（全部5回までは均等→その後は苦手多め）</option>
    <option value="weak">苦手を多めにランダム</option><option value="onlyweak">苦手だけ</option><option value="new">まだ出ていないもの</option><option value="flat">完全ランダム</option>
  </select>
  <select id="asked" aria-label="出題日で絞り込み">
    <option value="">出題日: すべて</option>
    <option value="in:0">今日出題したもの</option><option value="in:1">昨日出題したもの</option><option value="in:0-6">過去1週間に出題したもの</option>
    <option value="ex:0">今日出題したものを除く</option><option value="ex:1">昨日出題したものを除く</option>
    <option value="ex:0-1">昨日・今日出題したものを除く</option><option value="ex:0-6">過去1週間に出題したものを除く</option>
    <option value="in:date">日付を指定して、その日に出題したもの</option><option value="ex:date">日付を指定して、その日に出題したものを除く</option>
  </select>
  <input type="date" id="adate" aria-label="出題日" hidden>
  <select id="wrong" aria-label="間違えた日で絞り込み">
    <option value="">間違えた日: すべて</option>
    <option value="in:0">今日間違えたもの</option><option value="in:1">昨日間違えたもの</option>
    <option value="in:0-6">過去1週間に間違えたもの</option><option value="in:0-29">過去30日に間違えたもの</option>
    <option value="ex:0-6">過去1週間に間違えたものを除く</option>
    <option value="in:date">日付を指定して、その日に間違えたもの</option>
  </select>
  <input type="date" id="wdate" aria-label="間違えた日" hidden>
  <div class="seg" id="speed" role="group" aria-label="読み上げの速さ">
    <button data-s="slow">ゆっくり</button><button data-s="normal" class="on">ふつう</button>
  </div>
</div>
<p class="status" id="status">読み込み中…</p>
<p class="help" id="help" hidden></p>
<div class="score" id="score"></div>

<div id="stage"></div>

<details class="weak" id="weakBox">
  <summary>苦手なもの（間違いの多い順）</summary>
  <ul class="wl" id="weakList"></ul>
</details>
<div class="tools">
  <button id="btnExport">記録を書き出す</button>
  <button id="btnImport">記録を読み込む</button>
  <button id="btnReset">記録を消す</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>
</div>

        (cur.sib.length ? '<span class="tag sim">似た意味 ほか' + cur.sib.length + '件</span>' : '') + '</div>' +
      '<div class="ja">' + (cur.sib.length ? '<span class="simmark" title="似た日本語の問題がほかにもあります">≒</span>' : '') + esc(cur.ja) + '</div>' +
      (cur.sib.length ? '<div class="simnote">同じような日本語の問題がほかに <b>' + cur.sib.length + '件</b> あります。どれを聞かれているか分かるように、<b>ヒントで語数と頭文字を見てから</b>答えましょう。</div>' : '') +
      (hasPH ? '<div class="note">A・V などの記号はそのまま書いても、具体的な語を入れても正解です。</div>' : '') +
      '<div class="shape" id="shape"></div>' +
      '<div class="inrow"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英語で答える" aria-label="答え">' +
        '<button class="iconbtn" id="mic" title="英語で言う" aria-label="英語で言う">' + ICON.mic + '</button></div>' +
      '<div class="acts"><button class="primary" id="check">答え合わせ</button><button id="hint"' + (cur.sib.length ? ' class="nudge"' : '') + '>ヒント' + (cur.sib.length ? 'を見る' : '') + '</button><button id="giveup">わからない</button>' +
        '<span class="kbd">Enter で答え合わせ → Enter で次へ</span></div>' +
      '<div id="result"></div>' +
    '</div>';
  var ans = $('ans');
  ans.focus();
  ans.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); if (cur && cur.done) next(); else check(false); }
  });
  $('check').onclick = function () { check(false); };
  $('giveup').onclick = function () { check(true); };
  $('hint').onclick = function () { $('shape').textContent = shapeOf(cur.word); cur.hinted = true; this.classList.remove('nudge'); ans.focus(); };
  if (cur.sib.length) ans.placeholder = 'ヒントを見てから英語で答える';
  $('mic').onclick = function () { startRecog(ans, $('mic'), function () { if (!cur.done) check(false); }); };
  renderScore();
}
function check(giveup) {
  if (!cur || cur.done) return;
  var user = $('ans').value.trim();
  if (!user && !giveup) { $('ans').focus(); return; }
  var r = giveup ? { v: 'ng', alt: expandAlt(cleanWord(cur.word))[0], at: toks(expandAlt(cleanWord(cur.word))[0], true), ut: [] } : judge(user, cur.word);
  /* 似た意味の別の問題の答えを書いたとき */
  var other = null;
  if (r.v !== 'ok' && user) cur.sib.some(function (o) { if (judge(user, o.word).v === 'ok') { other = o; return true; } return false; });
  if (other) r.v = 'near';
  cur.done = true; cur.v = r.v;
  record(cur.key, r.v);
  session.n++; if (r.v === 'ok') session.ok++;
  var label = other ? '似た意味の別の語句です（「' + cleanWord(other.word) + '」第' + other.ep + '回）'
    : { ok: '正解！', near: '惜しい（つづりや語が少しちがう）', ng: giveup ? 'わからなかった' : '不正解' }[r.v];
  var simHtml = cur.sib.length ? '<div class="lbl">似た意味の語句（区別して覚えよう）</div><ul class="simlist">' +
    cur.sib.slice(0, 12).map(function (o) { return '<li' + (o === other ? ' class="hit"' : '') + '><span class="en">' + esc(cleanWord(o.word)) + '</span> <span class="jp">' + esc(o.ja) + '（第' + esc(o.ep) + '回）</span></li>'; }).join('') +
    (cur.sib.length > 12 ? '<li class="jp">…ほか' + (cur.sib.length - 12) + '件</li>' : '') + '</ul>' : '';
  if (cur.hinted) { var lg = stat(cur.key).log; if (lg.length) { lg[lg.length - 1][2] = 'h'; lsSet(LS_REC, REC); } }
  var exHtml;
  if (cur.ex) {
    exHtml = '<div class="lbl">本文の例文' + (cur.exSrc === 'self' ? '（番組のセリフそのまま）' : '') + ' <span class="ex-src">— 第' + esc(cur.ep) + '回</span></div>' +
      '<div class="ex">' + (cur.exSrc === 'self' ? esc(cur.ex) : markExample(cur.ex, cur.word)) + '</div>' +
      '<div class="acts"><button class="pill" id="sayEx">' + ICON.play + '例文を聞く</button><button class="pill" id="repeat">' + ICON.mic + '例文を言ってみる</button></div>' +
      '<div class="note" id="repRes"></div>';
  } else {
    exHtml = '<div class="lbl">本文の例文</div><div class="noex">この語は本文に例文が見つかりませんでした。</div>';
  }
  $('result').innerHTML =
    '<div class="result">' +
      '<span class="verdict ' + r.v + '">' + label + '</span>' +
      '<div class="lbl">答え</div>' +
      '<div class="answer"><span>' + esc(cleanWord(cur.word)) + '</span><button class="pill" id="sayAns">' + ICON.play + '聞く</button></div>' +
      (cur.jaNote ? '<div class="note">※' + esc(cur.jaNote) + '</div>' : '') +
      (user && r.v !== 'ok' ? '<div class="lbl">あなたの答え（<span style="color:var(--ng)">赤線</span>は足りない語、取り消し線はちがう語）</div><div class="yours">' + diffHtml(r.ut, r.at) + '</div>' : '') +
      exHtml + simHtml +
      '<div class="fix">' +
        (r.v !== 'ok' && user ? '<span>この答えでも合っている →</span><button id="fixOk">正解にする</button>' : '') +
        (r.v === 'ok' ? '<span>自信がなかった →</span><button id="fixNg">不正解にする</button>' : '') +
      '</div>' +
      '<div class="hist" id="hist"></div>' +
      '<div class="acts"><button class="primary" id="next">次の問題 →</button></div>' +
    '</div>';
  renderHist();
  $('sayAns').onclick = function () { TTS.say(expandAlt(cleanWord(cur.word))[0].replace(/[～〜~]/g, ''), this); };
  if ($('sayEx')) $('sayEx').onclick = function () { TTS.say(cur.ex, this); };
  if ($('repeat')) $('repeat').onclick = function () {
    var box = { value: '' }, btn = this;
    startRecog({ set value(v) { box.value = v; $('repRes').textContent = '聞き取り: ' + v; }, get value() { return box.value; } }, btn, function () {
      var a = toks(cur.ex, false), b = toks(box.value, false), hit = 0, used = {};
      b.forEach(function (w) { var i = a.indexOf(w); while (i >= 0 && used[i]) i = a.indexOf(w, i + 1); if (i >= 0) { used[i] = 1; hit++; } });
      var pct = a.length ? Math.round(100 * hit / a.length) : 0;
      $('repRes').innerHTML = '聞き取り: <span style="font-family:var(--font-en)">' + esc(box.value) + '</span> — 一致 <b>' + pct + '%</b>';
    });
  };
  if ($('fixOk')) $('fixOk').onclick = function () { record(cur.key, 'ok', cur.v); if (cur.v !== 'ok') session.ok++; cur.v = 'ok'; this.parentNode.innerHTML = '<span>正解として記録しました。</span>'; renderScore(); renderHist(); renderWeak(); };
  if ($('fixNg')) $('fixNg').onclick = function () { record(cur.key, 'ng', cur.v); session.ok--; cur.v = 'ng'; this.parentNode.innerHTML = '<span>不正解として記録しました。</span>'; renderScore(); renderHist(); renderWeak(); };
  $('next').onclick = next;
  $('ans').readOnly = true;
  $('ans').focus();
  if (r.v === 'ok') TTS.say(cur.ex || cleanWord(cur.word));
  renderScore(); renderWeak();
}
/* この問題の出題履歴（新しい順） */
function renderHist() {
  var el = $('hist'); if (!el || !cur) return;
  var log = stat(cur.key).log.slice().reverse();
  el.innerHTML = '出題履歴: ' + log.slice(0, 20).map(function (l) {
    var c = l[1] === 'o' ? 'o' : l[1] === 'x' ? 'x' : 'n';
    return '<span class="' + c + '">' + fmtTime(l[0]) + ' ' + (l[1] === 'o' ? '○' : l[1]) + '</span>';
  }).join(' · ') + (log.length > 20 ? ' …ほか' + (log.length - 20) + '回' : '');
}
function renderWeak() {
  var list = ITEMS.map(function (it) { return { it: it, s: stat(it.key) }; })
    .filter(function (x) { return isWeak(x.s); })
    .sort(function (a, b) { return (b.s.ng + b.s.near * .5) - (a.s.ng + a.s.near * .5) || errRate(b.s) - errRate(a.s); })
    .slice(0, 50);
  $('weakList').innerHTML = list.length ? list.map(function (x) {
    return '<li><span class="en">' + esc(cleanWord(x.it.word)) + '</span><span class="cnt">× ' + x.s.ng + (x.s.near ? ' △ ' + x.s.near : '') + ' / ' + x.s.n + '回</span><span class="jp">' + esc(x.it.ja) + '（第' + esc(x.it.ep) + '回' + (lastWrong(x.s) ? '・最後に間違えた ' + fmtDay(lastWrong(x.s)) : '') + '）</span></li>';
  }).join('') : '<li><span class="jp">まだありません。</span></li>';
}

/* ============ 設定・記録の出し入れ ============ */
function syncDateInputs() {
  $('adate').hidden = !/date/.test($('asked').value);
  $('wdate').hidden = !/date/.test($('wrong').value);
  if (!$('adate').hidden && !$('adate').value) $('adate').value = dayKey(Date.now() - 864e5);
  if (!$('wdate').hidden && !$('wdate').value) $('wdate').value = dayKey(Date.now() - 864e5);
}
function savePref() {
  PREF = { v: 2, month: $('month').value, kind: $('kind').value, mode: $('mode').value, asked: $('asked').value, wrong: $('wrong').value,
    adate: $('adate').value, wdate: $('wdate').value, speed: PREF.speed || 'normal' };
  lsSet(LS_PREF, PREF);
}
['month', 'kind', 'mode', 'asked', 'wrong', 'adate', 'wdate'].forEach(function (id) { $(id).addEventListener('change', function () { syncDateInputs(); savePref(); next(); }); });
Array.prototype.forEach.call(document.querySelectorAll('#speed button'), function (b) {
  b.onclick = function () {
    Array.prototype.forEach.call(document.querySelectorAll('#speed button'), function (x) { x.classList.toggle('on', x === b); });
    TTS.setRate(b.dataset.s === 'slow' ? 0.65 : 0.92); PREF.speed = b.dataset.s; lsSet(LS_PREF, PREF);
  };
});
$('btnExport').onclick = function () {
  var blob = new Blob([JSON.stringify({ app: 'unkquiz', at: new Date().toISOString(), rec: REC })], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'unknown-drill-record.json'; a.click();
};
$('btnImport').onclick = function () { $('importFile').click(); };
$('importFile').onchange = function () {
  var f = this.files[0]; if (!f) return;
  f.text().then(function (t) {
    var d = JSON.parse(t); if (!d || !d.rec) throw new Error();
    Object.keys(d.rec).forEach(function (k) { var a = REC[k], b = d.rec[k]; if (!a || (b.t || 0) > (a.t || 0)) REC[k] = b; });
    lsSet(LS_REC, REC); renderWeak(); renderScore(); note('記録を読み込みました。');
  }).catch(function () { note('記録ファイルを読み込めませんでした。'); });
};
$('btnReset').onclick = function () { if (confirm('これまでの解答記録をすべて消します。よろしいですか？')) { REC = {}; lsSet(LS_REC, REC); renderWeak(); next(); } };

function start(d, fromCache) {
  build(d.rows || []);
  var months = [];
  ITEMS.forEach(function (it) { if (months.indexOf(it.month) < 0) months.push(it.month); });
  months.sort(function (a, b) { return ((+a + 8) % 12) - ((+b + 8) % 12); });   /* 4月はじまり */
  $('month').innerHTML = '<option value="">すべての月</option>' + months.map(function (m) { return '<option value="' + esc(m) + '">' + esc(m) + '月</option>'; }).join('');
  if (PREF.month && months.indexOf(PREF.month) >= 0) $('month').value = PREF.month;
  if (PREF.kind) $('kind').value = PREF.kind;
  if (PREF.v === 2) {   /* v2 より前に保存した出し方は使わず、おまかせから始める */
    if (PREF.mode) $('mode').value = PREF.mode;
    if (PREF.asked) $('asked').value = PREF.asked;
    if (PREF.wrong) $('wrong').value = PREF.wrong;
    if (PREF.adate) $('adate').value = PREF.adate;
    if (PREF.wdate) $('wdate').value = PREF.wdate;
  }
  syncDateInputs();
  if (PREF.speed === 'slow') document.querySelector('#speed [data-s=slow]').click();
  $('status').textContent = ITEMS.length + ' 語句（' + (d.updated || '') + ' 更新' + (fromCache ? '・前回読み込んだデータ' : '') + '）';
  renderWeak(); next();
}
var cached = lsGet(LS_DATA, null);
fetch(DATA_URL).then(function (r) { return r.json(); }).then(function (d) {
  if (!d || !d.rows) throw new Error('bad');
  lsSet(LS_DATA, d); start(d, false);
}).catch(function () {
  if (cached) start(cached, true);
  else $('status').textContent = 'データを読み込めませんでした。通信状態を確認して、ページを開き直してください。';
});
</script>
</body>
