<style>

  }
  :root[data-theme="dark"] {

    --accent: #7FA6DC; --accent-tint: #1D2941; --rule: #2C313B; --rule-soft: #232830;
    --ok: #63C79A; --ok-tint: #16311F; --near: #DCB45C; --near-tint: #322A15; --ng: #E58279; --ng-tint: #35201E;

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-jp); line-height: 1.6; }

  .status { font-size: .82rem; color: var(--faint); margin: 0 0 10px; }

  .score { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin: 0 0 10px; }
  .score b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .score .ok b { color: var(--ok); } .score .ng b { color: var(--ng); }

  .inrow input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  .acts button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
  .pill svg { width: 16px; height: 16px; }
  .pill.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .simmark { display: inline-block; color: var(--accent); background: var(--accent-tint); border-radius: 6px; padding: 0 6px; margin-right: 6px; font-size: .95em; }
  .simnote { font-size: .85rem; background: var(--accent-tint); border-radius: 8px; padding: 6px 10px; margin: 4px 0 8px; }
  .acts button.nudge { border: 2px solid var(--accent); color: var(--accent); font-weight: 700; animation: nudge 1.6s ease-in-out 3; }
  @keyframes nudge { 50% { box-shadow: 0 0 0 5px var(--accent-tint); } }
  @media (prefers-reduced-motion: reduce) { .acts button.nudge { animation: none; } }
  .simlist { list-style: none; margin: 2px 0 0; padding: 0; font-size: .88rem; }
  .simlist li { padding: 3px 0; border-top: 1px solid var(--rule-soft); }
  .simlist li.hit { background: var(--near-tint); }
  .simlist .en { font-family: var(--font-en); font-weight: 700; }
  .simlist .jp { color: var(--muted); }
  .grouphd { font-size: .88rem; background: var(--accent-tint); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px; }
  .q + .q { border-top: 1px dashed var(--rule); margin-top: 16px; padding-top: 14px; }
  .qn { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 8px; font-weight: 700; }
  .cloze { margin: 4px 0 10px; }
  .blank { display: inline-block; min-width: 3.4em; height: 1.1em; border-bottom: 2px solid var(--accent); margin: 0 3px; vertical-align: -3px; }
  .acts[hidden] { display: none; }
  .kbd { font-size: .72rem; color: var(--faint); margin-left: auto; align-self: center; }

  .result { margin-top: 14px; border-top: 1px solid var(--rule-soft); padding-top: 12px; }
  .verdict { font-weight: 700; font-size: 1rem; padding: 6px 10px; border-radius: 8px; display: inline-block; }
  .verdict.ok { background: var(--ok-tint); color: var(--ok); }
  .verdict.near { background: var(--near-tint); color: var(--near); }
  .verdict.ng { background: var(--ng-tint); color: var(--ng); }
  .lbl { font-size: .75rem; color: var(--faint); margin: 12px 0 2px; }
  .answer { font-family: var(--font-en); font-size: 1.25rem; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .ex-src { font-size: .75rem; color: var(--faint); }

<body>
<div class="wrap">
<header>
  <h1>Unknown 英作文ドリル</h1>
  <p>ラジオ英会話の Unknown words/phrases から出題します。日本語の意味と本文の例文を見て、<b>空所に入る英語を書くか🎤で言って</b>ください。
     似た意味の語句はまとめて出ます。間違えたものほどよく出ます。<a href="idioms.html">イディオム例文集</a> · <a href="./">聞き取れなかった英文</a></p>
</header>

<div class="bar">
  <select id="month" aria-label="出題する月"><option value="">すべての月</option></select>
  <select id="kind" aria-label="種類">
    <option value="">すべての種類</option><option value="phrase">熟語・イディオム</option><option value="word">単語</option><option value="sent">文・セリフ</option>
  </select>
  <select id="mode" aria-label="出し方">
    <option value="auto">おまかせ（全部5回までは均等→その後は苦手多め）</option>
    <option value="weak">苦手を多めにランダム</option><option value="onlyweak">苦手だけ</option><option value="new">まだ出ていないもの</option><option value="flat">完全ランダム</option><option value="mastered">一発正解したもの（ふだんは出ない）</option>
  </select>
  <select id="asked" aria-label="出題日で絞り込み">
    <option value="">出題日: すべて</option>
    <option value="in:0">今日出題したもの</option><option value="in:1">昨日出題したもの</option><option value="in:0-6">過去1週間に出題したもの</option>
    <option value="ex:0">今日出題したものを除く</option><option value="ex:1">昨日出題したものを除く</option>
    <option value="ex:0-1">昨日・今日出題したものを除く</option><option value="ex:0-6">過去1週間に出題したものを除く</option>
    <option value="in:date">日付を指定して、その日に出題したもの</option><option value="ex:date">日付を指定して、その日に出題したものを除く</option>
  </select>
  <input type="date" id="adate" aria-label="出題日" hidden>
  <select id="wrong" aria-label="間違えた日で絞り込み">
    <option value="">間違えた日: すべて</option>
    <option value="in:0">今日間違えたもの</option><option value="in:1">昨日間違えたもの</option>
    <option value="in:0-6">過去1週間に間違えたもの</option><option value="in:0-29">過去30日に間違えたもの</option>
    <option value="ex:0-6">過去1週間に間違えたものを除く</option>
    <option value="in:date">日付を指定して、その日に間違えたもの</option>
  </select>
  <input type="date" id="wdate" aria-label="間違えた日" hidden>
  <div class="seg" id="speed" role="group" aria-label="読み上げの速さ">
    <button data-s="slow">ゆっくり</button><button data-s="normal" class="on">ふつう</button>
  </div>
</div>
<p class="status" id="status">読み込み中…</p>
<p class="help" id="help" hidden></p>
<div class="score" id="score"></div>

<div id="stage"></div>

<details class="weak" id="weakBox">
  <summary>苦手なもの<span id="weakCnt"></span></summary>
  <div class="bar wbar">
    <select id="wkDay" aria-label="間違えた日">
      <option value="">間違えた日: すべて</option>
      <option value="in:0">今日間違えた</option><option value="in:1">昨日間違えた</option>
      <option value="in:0-6">過去1週間に間違えた</option><option value="in:0-29">過去30日に間違えた</option>
      <option value="in:date">日付を指定</option>
    </select>
    <input type="date" id="wkDate" aria-label="間違えた日を指定" hidden>
    <select id="wkSort" aria-label="並び順">
      <option value="new">間違えた日が新しい順</option><option value="old">間違えた日が古い順</option><option value="count">間違いの多い順</option>
    </select>
  </div>
  <ul class="wl" id="weakList"></ul>
</details>
<details class="weak" id="mastBox">
  <summary>一発正解（次から出題しないもの）<span id="mastCnt"></span></summary>
  <p class="note">1回目にヒントなしで正解したものです。出題に戻したいものは「出題に戻す」を押してください。出し方を「一発正解したもの」にすると、これだけで復習できます。</p>
  <ul class="wl" id="mastList"></ul>
</details>
<div class="tools">
  <button id="btnExport">記録を書き出す</button>
  <button id="btnImport">記録を読み込む</button>
  <button id="btnReset">記録を消す</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>
</div>

    ? '<div class="lbl">' + (it.exSrc === 'made' ? '例文（本文に無いので作った文）' : '本文の例文' + (it.exSrc === 'self' ? '（番組のセリフそのまま）' : '') + ' <span class="ex-src">— 第' + esc(it.ep) + '回</span>') + '</div>' +
      '<div class="ex">' + (it.exSrc === 'self' ? esc(it.ex) : markExample(it.ex, it.word)) + '</div>' +
      '<div class="acts"><button class="pill" id="sayEx' + i + '">' + ICON.play + '例文を聞く</button><button class="pill" id="repeat' + i + '">' + ICON.mic + '例文を言ってみる</button></div>' +
      '<div class="note" id="repRes' + i + '"></div>'
    : '';
  var s = stat(it.key);
  $('res' + i).innerHTML =
    '<div class="result">' +
      '<span class="verdict ' + r.v + '">' + label + '</span>' +
      '<div class="lbl">答え</div>' +
      '<div class="answer"><span>' + esc(ansText) + '</span>' + (ansText.toLowerCase() !== phrase.toLowerCase() ? '<span class="note">語句: ' + esc(phrase) + '</span>' : '') +
        '<button class="pill" id="sayAns' + i + '">' + ICON.play + '聞く</button></div>' +
      (it.jaNote ? '<div class="note">※' + esc(it.jaNote) + '</div>' : '') +
      (user && r.v !== 'ok' && r.at ? '<div class="lbl">あなたの答え（<span style="color:var(--ng)">赤線</span>は足りない語、取り消し線はちがう語）</div><div class="yours">' + diffHtml(r.ut, r.at) + '</div>' : '') +
      exHtml +
      '<div class="fix" id="fix' + i + '">' +
        (r.v !== 'ok' && user ? '<span>この答えでも合っている →</span><button id="fixOk' + i + '">正解にする</button>' : '') +
        (r.v === 'ok' ? '<span>自信がなかった →</span><button id="fixNg' + i + '">不正解にする</button>' : '') +
      '</div>' +
      (isMastered(s) && s.n === 1 ? '<div class="simnote" id="mastNote' + i + '">一発正解！ この問題は次から出題しません（下の「一発正解」に入ります）。 <button class="pill" id="mastBack' + i + '">また出す</button></div>' : '') +
      '<div class="hist" id="hist' + i + '"></div>' +
    '</div>';
  renderHist(it, i);
  if ($('mastBack' + i)) $('mastBack' + i).onclick = function () { setBack(it.key); $('mastNote' + i).textContent = 'この問題はこれからも出題します。'; };
  $('sayAns' + i).onclick = function () { TTS.say(it.cz ? it.cz.answer : expandAlt(phrase)[0].replace(/[～〜~]/g, ''), this); };
  if ($('sayEx' + i)) $('sayEx' + i).onclick = function () { TTS.say(it.ex, this); };
  if ($('repeat' + i)) $('repeat' + i).onclick = function () {
    var box = { value: '' }, btn = this;
    startRecog({ set value(v) { box.value = v; $('repRes' + i).textContent = '聞き取り: ' + v; }, get value() { return box.value; } }, btn, function () {
      var a = toks(it.ex, false), b = toks(box.value, false), hit = 0, used = {};
      b.forEach(function (w) { var k = a.indexOf(w); while (k >= 0 && used[k]) k = a.indexOf(w, k + 1); if (k >= 0) { used[k] = 1; hit++; } });
      var pct = a.length ? Math.round(100 * hit / a.length) : 0;
      $('repRes' + i).innerHTML = '聞き取り: <span style="font-family:var(--font-en)">' + esc(box.value) + '</span> — 一致 <b>' + pct + '%</b>';
    });
  };
  if ($('fixOk' + i)) $('fixOk' + i).onclick = function () { record(it.key, 'ok', it.v); if (it.v !== 'ok') session.ok++; it.v = 'ok'; $('fix' + i).innerHTML = '<span>正解として記録しました。</span>'; renderScore(); renderHist(it, i); renderWeak(); };
  if ($('fixNg' + i)) $('fixNg' + i).onclick = function () { record(it.key, 'ng', it.v); session.ok--; it.v = 'ng'; if ($('mastNote' + i)) $('mastNote' + i).remove(); $('fix' + i).innerHTML = '<span>不正解として記録しました。</span>'; renderScore(); renderHist(it, i); renderWeak(); };
}
/* この問題の出題履歴（新しい順） */
function renderHist(it, i) {
  var el = $('hist' + i); if (!el) return;
  var log = stat(it.key).log.slice().reverse();
  el.innerHTML = '出題履歴: ' + log.slice(0, 20).map(function (l) {
    var c = l[1] === 'o' ? 'o' : l[1] === 'x' ? 'x' : 'n';
    return '<span class="' + c + '">' + fmtTime(l[0]) + ' ' + (l[1] === 'o' ? '○' : l[1]) + '</span>';
  }).join(' · ') + (log.length > 20 ? ' …ほか' + (log.length - 20) + '回' : '');
}
function renderWeak() {
  var day = $('wkDay').value, dval = $('wkDate').value, sort = $('wkSort').value;
  $('wkDate').hidden = day !== 'in:date';
  if (day === 'in:date' && !dval) { dval = $('wkDate').value = dayKey(Date.now() - 864e5); }
  var all = ITEMS.map(function (it) { return { it: it, s: stat(it.key) }; }).filter(function (x) { return isWeak(x.s); });
  var list = all.map(function (x) {
      /* 絞り込んだ期間の中で、いちばん新しい間違えた時刻 */
      var ts = x.s.log.filter(function (l) { return l[1] !== 'o' && (!day || dayMatch(day, [l[0]], dval)); }).map(function (l) { return l[0]; });
      x.wt = ts.length ? Math.max.apply(null, ts) : 0; x.wn = ts.length; return x;
    })
    .filter(function (x) { return !day || x.wn > 0; })
    .sort(function (a, b) {
      if (sort === 'count') return (b.s.ng + b.s.near * .5) - (a.s.ng + a.s.near * .5) || b.wt - a.wt;
      return sort === 'old' ? a.wt - b.wt : b.wt - a.wt;
    });
  $('weakCnt').textContent = '　' + (day ? list.length + '/' : '') + all.length + '件';
  var shown = list.slice(0, 200);
  $('weakList').innerHTML = shown.length ? shown.map(function (x) {
    return '<li><span class="en">' + esc(cleanWord(x.it.word)) + '</span><span class="cnt">× ' + x.s.ng + (x.s.near ? ' △ ' + x.s.near : '') + ' / ' + x.s.n + '回</span><span class="jp">' + esc(x.it.ja) + '（第' + esc(x.it.ep) + '回' + (x.wt ? '・間違えた ' + fmtTime(x.wt) : '') + (day && x.wn > 1 ? '（この期間に' + x.wn + '回）' : '') + '）</span></li>';
  }).join('') + (list.length > 200 ? '<li><span class="jp">…ほか' + (list.length - 200) + '件</span></li>' : '')
    : '<li><span class="jp">' + (day ? 'この期間に間違えたものはありません。' : 'まだありません。') + '</span></li>';
  var mast = ITEMS.map(function (it) { return { it: it, s: stat(it.key) }; })
    .filter(function (x) { return isMastered(x.s); })
    .sort(function (a, b) { return b.s.log[0][0] - a.s.log[0][0]; });
  $('mastCnt').textContent = '　' + mast.length + '件';
  $('mastList').innerHTML = mast.length ? mast.map(function (x) {
    return '<li><span class="en">' + esc(cleanWord(x.it.word)) + '</span><span class="cnt"><button class="pill" data-back="' + esc(x.it.key) + '">出題に戻す</button></span><span class="jp">' + esc(x.it.ja) + '（第' + esc(x.it.ep) + '回・' + fmtDay(x.s.log[0][0]) + ' に一発正解' + (x.s.n > 1 ? '・その後 ' + (x.s.n - 1) + '回復習' : '') + '）</span></li>';
  }).join('') : '<li><span class="jp">まだありません。</span></li>';
}
['wkDay', 'wkDate', 'wkSort'].forEach(function (id) { $(id).addEventListener('change', renderWeak); });
function setBack(key) { var s = stat(key); s.back = true; REC[key] = s; lsSet(LS_REC, REC); renderWeak(); renderScore(); }
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-back]');
  if (b) setBack(b.getAttribute('data-back'));
});

/* ============ 設定・記録の出し入れ ============ */
function syncDateInputs() {
  $('adate').hidden = !/date/.test($('asked').value);
  $('wdate').hidden = !/date/.test($('wrong').value);
  if (!$('adate').hidden && !$('adate').value) $('adate').value = dayKey(Date.now() - 864e5);
  if (!$('wdate').hidden && !$('wdate').value) $('wdate').value = dayKey(Date.now() - 864e5);
}
function savePref() {
  PREF = { v: 2, month: $('month').value, kind: $('kind').value, mode: $('mode').value, asked: $('asked').value, wrong: $('wrong').value,
    adate: $('adate').value, wdate: $('wdate').value, speed: PREF.speed || 'normal' };
  lsSet(LS_PREF, PREF);
}
['month', 'kind', 'mode', 'asked', 'wrong', 'adate', 'wdate'].forEach(function (id) { $(id).addEventListener('change', function () { syncDateInputs(); savePref(); next(); }); });
Array.prototype.forEach.call(document.querySelectorAll('#speed button'), function (b) {
  b.onclick = function () {
    Array.prototype.forEach.call(document.querySelectorAll('#speed button'), function (x) { x.classList.toggle('on', x === b); });
    TTS.setRate(b.dataset.s === 'slow' ? 0.65 : 0.92); PREF.speed = b.dataset.s; lsSet(LS_PREF, PREF);
  };
});
$('btnExport').onclick = function () {
  var blob = new Blob([JSON.stringify({ app: 'unkquiz', at: new Date().toISOString(), rec: REC })], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'unknown-drill-record.json'; a.click();
};
$('btnImport').onclick = function () { $('importFile').click(); };
$('importFile').onchange = function () {
  var f = this.files[0]; if (!f) return;
  f.text().then(function (t) {
    var d = JSON.parse(t); if (!d || !d.rec) throw new Error();
    Object.keys(d.rec).forEach(function (k) { var a = REC[k], b = d.rec[k]; if (!a || (b.t || 0) > (a.t || 0)) REC[k] = b; });
    lsSet(LS_REC, REC); renderWeak(); renderScore(); note('記録を読み込みました。');
  }).catch(function () { note('記録ファイルを読み込めませんでした。'); });
};
$('btnReset').onclick = function () { if (confirm('これまでの解答記録をすべて消します。よろしいですか？')) { REC = {}; lsSet(LS_REC, REC); renderWeak(); next(); } };

function start(d, fromCache) {
  build(d.rows || []);
  var months = [];
  ITEMS.forEach(function (it) { if (months.indexOf(it.month) < 0) months.push(it.month); });
  months.sort(function (a, b) { return ((+a + 8) % 12) - ((+b + 8) % 12); });   /* 4月はじまり */
  $('month').innerHTML = '<option value="">すべての月</option>' + months.map(function (m) { return '<option value="' + esc(m) + '">' + esc(m) + '月</option>'; }).join('');
  if (PREF.month && months.indexOf(PREF.month) >= 0) $('month').value = PREF.month;
  if (PREF.kind) $('kind').value = PREF.kind;
  if (PREF.v === 2) {   /* v2 より前に保存した出し方は使わず、おまかせから始める */
    if (PREF.mode) $('mode').value = PREF.mode;
    if (PREF.asked) $('asked').value = PREF.asked;
    if (PREF.wrong) $('wrong').value = PREF.wrong;
    if (PREF.adate) $('adate').value = PREF.adate;
    if (PREF.wdate) $('wdate').value = PREF.wdate;
  }
  syncDateInputs();
  if (PREF.speed === 'slow') document.querySelector('#speed [data-s=slow]').click();
  $('status').textContent = ITEMS.length + ' 語句（' + (d.updated || '') + ' 更新' + (fromCache ? '・前回読み込んだデータ' : '') + '）';
  renderWeak(); next();
}
var cached = lsGet(LS_DATA, null);
fetch(DATA_URL).then(function (r) { return r.json(); }).then(function (d) {
  if (!d || !d.rows) throw new Error('bad');
  lsSet(LS_DATA, d); start(d, false);
}).catch(function () {
  if (cached) start(cached, true);
  else $('status').textContent = 'データを読み込めませんでした。通信状態を確認して、ページを開き直してください。';
});
</script>
</body>
