<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しゃべって英語</title>
<meta name="description" content="日本語で話すと、その場で英語に訳して読み上げる。音声認識・翻訳・読み上げはすべて無料のブラウザ機能と無料APIで動く。">
<style>
  :root {
    --paper: #F2F1EE; --surface: #FFFFFF; --ink: #1B1D22; --muted: #5F6570; --faint: #8D939D;
    --accent: #2E4B7A; --accent-tint: #E4EAF3; --rule: #D9D8D4; --rule-soft: #E7E6E3;
    --ng: #A3372F; --ng-tint: #F7E2E0; --near-tint: #F7EED8; --hl: #FFE9A8; --on-accent: #FFFFFF; --rec: #C0392B;
    --font-en: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
    --font-jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, Meiryo, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12141A; --surface: #1A1D25; --ink: #E8EAEE; --muted: #A0A6B0; --faint: #79808B;
      --accent: #7FA6DC; --accent-tint: #1D2941; --rule: #2C313B; --rule-soft: #232830;
      --ng: #E58279; --ng-tint: #35201E; --near-tint: #322A15; --hl: #5A4A17; --on-accent: #12141A; --rec: #E5675A;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12141A; --surface: #1A1D25; --ink: #E8EAEE; --muted: #A0A6B0; --faint: #79808B;
    --accent: #7FA6DC; --accent-tint: #1D2941; --rule: #2C313B; --rule-soft: #232830;
    --ng: #E58279; --ng-tint: #35201E; --near-tint: #322A15; --hl: #5A4A17; --on-accent: #12141A; --rec: #E5675A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-jp); line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }
  header h1 { font-size: 1.35rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  header a { color: var(--accent); }
  .help { font-size: .85rem; background: var(--near-tint); border-radius: 8px; padding: 8px 10px; margin: 12px 0 0; }
  .stage { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 14px; padding: 18px 16px; margin: 16px 0; text-align: center; }
  .mic { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-size: .95rem; font-weight: 700; cursor: pointer; }
  .mic.on { background: var(--rec); animation: pulse 1.4s ease-in-out infinite; }
  .mic.wait { opacity: .55; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rec) 45%, transparent); } 50% { box-shadow: 0 0 0 14px transparent; } }
  .state { font-size: .85rem; color: var(--faint); margin: 10px 0 0; min-height: 1.4em; }
  .live { margin: 14px 0 0; min-height: 3.2em; text-align: left; }
  .live .ja { font-size: 1.05rem; }
  .live .ja.interim { color: var(--faint); }
  .live .en { font-family: var(--font-en); font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; margin: 14px 0 0; font-size: .85rem; color: var(--muted); align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; font-size: .82rem; padding: 5px 10px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  label.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .type { display: flex; gap: 8px; margin: 0 0 16px; }
  .type input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
  button.b { font: inherit; font-size: .85rem; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
  button.b.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .hist-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); margin: 0 0 6px; }
  .hist-h button { white-space: nowrap; flex: none; }
  .card { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 12px; padding: 10px 14px; margin: 0 0 8px; }
  .card .ja { font-size: .9rem; color: var(--muted); }
  .card .en { font-family: var(--font-en); font-size: 1.12rem; font-weight: 700; }
  .card .en.speaking { background: var(--hl); border-radius: 4px; }
  .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card .via { font-size: .72rem; color: var(--faint); }
  .card .err { color: var(--ng); font-size: .85rem; }
  .empty { color: var(--faint); font-size: .88rem; text-align: center; padding: 16px 0; }
  .faint { color: var(--faint); }
  .card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .who { font: inherit; font-size: .75rem; display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--rule); border-radius: 99px; background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .who.unsure { border-style: dashed; color: var(--muted); }
  .who i, .pchip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .people { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; font-size: .85rem; }
  .people .line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .pchip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px 2px 9px; border: 1px solid var(--rule); border-radius: 99px; }
  .pchip button { font: inherit; border: 0; background: none; color: var(--faint); cursor: pointer; padding: 0 4px; }
  .people summary { cursor: pointer; color: var(--accent); margin-top: 8px; }
  .enroll { margin-top: 8px; }
  .enroll .read { background: var(--accent-tint); border-radius: 8px; padding: 8px 10px; margin: 6px 0; line-height: 1.8; }
  .enroll .go { display: flex; gap: 8px; }
  .enroll input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .bar { height: 6px; background: var(--rule-soft); border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--rec); transition: width .1s linear; }
  .msg { color: var(--muted); min-height: 1.3em; margin: 0; }
  .dbg { margin-top: 20px; font-size: .72rem; }
  .dbg pre { white-space: pre-wrap; word-break: break-all; background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 8px; padding: 8px; max-height: 320px; overflow: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>しゃべって英語</h1>
    <p>日本語で話すと、その場で英語に訳して読み上げます。<a href="speak-stats.html"><b>記録と統計</b></a> ／ <a href="index.html">English PowerUp</a> ／ <a href="idioms.html">イディオム例文集</a></p>
    <p class="help" id="help" hidden></p>
  </header>

  <section class="stage">
    <button class="mic" id="mic" type="button">話す</button>
    <p class="state" id="state">ボタンを押して日本語で話してください</p>
    <div class="live" id="live"></div>
    <div class="opts">
      <span>速さ <span class="seg" id="speed"><button data-s="slow">ゆっくり</button><button data-s="normal" class="on">ふつう</button><button data-s="fast">速い</button></span></span>
      <label class="chk"><input type="checkbox" id="speakOn" checked>読み上げる</label>
      <label class="chk" title="スピーカーで読み上げた英語をマイクが拾わないように、読み上げ中は聞き取りを止めます。イヤホンなら外してもかまいません"><input type="checkbox" id="pauseOn" checked>読み上げ中は聞き取りを止める</label>
    </div>
  </section>

  <section class="people" aria-label="話す人">
    <div class="line">
      <span>話す人</span><span class="line" id="people"></span>
    </div>
    <div class="line" style="margin-top:6px">
      <label class="chk" title="登録した声と比べて、誰が話したかを記録します"><input type="checkbox" id="voiceOn">声で人を見分ける</label>
      <label class="chk" title="話した内容をこの端末に保存し、「記録と統計」で1日ごとに集計します"><input type="checkbox" id="recOn" checked>記録する</label>
    </div>
    <details>
      <summary>声を登録する（1人12秒）</summary>
      <div class="enroll">
        名前を入れて「録音」を押し、次の文をふだんの声で読んでください。同じ名前でもう一度読むと、より正確になります。
        <div class="read">今日はいい天気ですね。駅前の新しいお店で、コーヒーとケーキを注文しました。明日の予定は、午前中に買い物をして、午後は友だちと会います。</div>
        <div class="go"><input id="enName" placeholder="名前（例: 父、ゆき）" autocomplete="off"><button class="b primary" id="enGo" type="button">録音（12秒）</button></div>
        <div class="bar"><span id="enBar"></span></div>
        <p class="msg" id="enMsg"></p>
      </div>
    </details>
  </section>

  <form class="type" id="typeForm">
    <input id="typeIn" placeholder="文字で入力して訳すこともできます" autocomplete="off">
    <button class="b primary" type="submit">訳す</button>
  </form>

  <div class="hist-h"><span>今日の履歴（英語を押すともう一度読み上げ・名前を押すと話した人を直せます）</span><button class="b" id="clear" type="button">画面を消す</button></div>
  <div id="hist"><p class="empty">まだありません</p></div>
  <section class="dbg" id="dbg" hidden><b>調べもの用の記録</b>（新しい順）<pre id="dbgLog"></pre></section>
</div>

<script src="speak-lib.js"></script>
<script>
'use strict';
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function note(t) { $('help').textContent = t; $('help').hidden = false; }
function setState(t) { $('state').textContent = t; }

/* ============================================================
   翻訳（無料）
     1) Chrome 内蔵の翻訳（Translator API。端末内で訳す・無料・回数制限なし。初回だけ言語データをダウンロード）
     2) 使えなければ MyMemory の無料API（登録不要。1日あたりの文字数に上限あり）
   ============================================================ */
var Trans = (function () {
  var local = null, localTried = false;
  async function prepare() {     /* ボタンを押したとき（ユーザー操作中）に呼ぶ。言語データのダウンロードに操作が要るため */
    if (localTried) return; localTried = true;
    try {
      if (!('Translator' in self)) return;
      var a = await Translator.availability({ sourceLanguage: 'ja', targetLanguage: 'en' });
      if (a === 'unavailable') return;
      if (a !== 'available') setState('翻訳データを準備しています（初回だけ）…');
      local = await Translator.create({ sourceLanguage: 'ja', targetLanguage: 'en' });
    } catch (e) { local = null; }
  }
  async function viaMyMemory(text) {
    var r = await fetch('https://api.mymemory.translated.net/get?langpair=ja|en&q=' + encodeURIComponent(text));
    if (!r.ok) throw new Error('翻訳サービスの応答が異常です（' + r.status + '）');
    var j = await r.json();
    if (j.responseStatus && j.responseStatus != 200) throw new Error(j.responseDetails || '翻訳できませんでした');
    var out = (j.responseData && j.responseData.translatedText) || '';
    if (/MYMEMORY WARNING|QUOTA/i.test(out)) throw new Error('無料翻訳の1日の上限に達しました。Chrome の新しい版なら上限のない端末内翻訳が使えます');
    return out;
  }
  async function translate(text) {
    if (local) { try { return { en: await local.translate(text), via: 'Chrome内蔵の翻訳' }; } catch (e) {} }
    return { en: await viaMyMemory(text), via: 'MyMemory（無料API）' };
  }
  /* 話している途中の下訳（端末内の翻訳があるときだけ。無料APIの上限を使わないため） */
  async function preview(text) { if (!local) return null; try { return await local.translate(text); } catch (e) { return null; } }
  return { prepare: prepare, translate: translate, preview: preview };
})();

/* ============================================================
   読み上げ（英語）。順番待ちして1つずつ読む
   ============================================================ */
var TTS = (function () {
  var synth = window.speechSynthesis, voice = null, rate = 0.95, queue = [], busy = false, onIdle = null;
  var RATES = { slow: 0.7, normal: 0.95, fast: 1.15 };
  if (!synth) note('このブラウザは読み上げに対応していません。訳は画面に出ます。');
  function pick() {
    if (!synth) return; var vs = synth.getVoices(); if (!vs.length) return;
    var en = vs.filter(function (v) { return /^en(-|_)/i.test(v.lang); });
    if (!en.length) { note('この端末に英語の読み上げ音声が入っていません。Windows なら 設定 → 時刻と言語 → 音声認識 で英語の音声を追加できます。'); return; }
    var pref = ['Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Samantha', 'Microsoft Zira'];
    voice = null;
    for (var i = 0; i < pref.length && !voice; i++) for (var j = 0; j < en.length; j++) if (en[j].name.indexOf(pref[i]) >= 0) { voice = en[j]; break; }
    if (!voice) voice = en.filter(function (v) { return /^en-US/i.test(v.lang); })[0] || en[0];
  }
  if (synth) { pick(); if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pick; }
  function next() {
    if (!queue.length) { busy = false; if (onIdle) onIdle(); return; }
    busy = true;
    var it = queue.shift(), u = new SpeechSynthesisUtterance(it.text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
    u.rate = RATES[speedKey];
    if (it.el) it.el.classList.add('speaking');
    u.onend = u.onerror = function () { if (it.el) it.el.classList.remove('speaking'); next(); };
    synth.speak(u);
  }
  var speedKey = 'normal';
  function say(text, el) { if (!synth || !text) return; queue.push({ text: text, el: el }); if (!busy) next(); }
  function stop() { queue = []; if (synth) synth.cancel(); }
  return { say: say, stop: stop, busy: function () { return busy; }, setSpeed: function (s) { speedKey = s; }, onIdle: function (f) { onIdle = f; } };
})();

/* ============================================================
   声で人を見分ける（端末内だけで計算・無料）
     マイクの音から 0.03 秒ごとに「声の特徴」（MFCC 12個＋声の高さ）を取り、
     登録した人ごとの特徴の平均・ばらつきと比べて、いちばん近い人を選ぶ。
     声が出ている（音が大きく、高さが取れる）瞬間だけを使う。
   ============================================================ */
var Voice = (function () {
  var ctx = null, node = null, stream = null, frames = [], on = false, noise = 0.004, voicedN = 0;
  var FFT = 1024, NM = 24, NC = 12, D = NC + 1, melW = null, dct = null, spec;
  function build(sr) {
    var mel = function (f) { return 2595 * Math.log10(1 + f / 700); }, inv = function (m) { return 700 * (Math.pow(10, m / 2595) - 1); };
    var lo = mel(80), hi = mel(Math.min(7600, sr / 2 - 100)), pts = [];
    for (var i = 0; i < NM + 2; i++) pts.push(inv(lo + (hi - lo) * i / (NM + 1)) / (sr / FFT));
    melW = [];
    for (var m = 0; m < NM; m++) {
      var w = new Float32Array(FFT / 2), a = pts[m], b = pts[m + 1], c = pts[m + 2];
      for (var k = Math.floor(a); k <= Math.ceil(c) && k < FFT / 2; k++) w[k] = k < a || k > c ? 0 : (k <= b ? (k - a) / (b - a) : (c - k) / (c - b));
      melW.push(w);
    }
    dct = [];
    for (var n = 1; n <= NC; n++) { var row = new Float32Array(NM); for (var j = 0; j < NM; j++) row[j] = Math.cos(Math.PI * n * (j + 0.5) / NM); dct.push(row); }
  }
  function pitch(x, sr) {                     /* 自己相関で声の高さ（70〜400Hz）。取れなければ 0 */
    var N = x.length, minL = Math.floor(sr / 400), maxL = Math.min(Math.floor(sr / 70), N - 200), best = 0, bestL = 0;
    for (var L = minL; L <= maxL; L += 2) {
      var s = 0, e1 = 0, e2 = 0;
      for (var i = 0; i + L < N; i += 2) { s += x[i] * x[i + L]; e1 += x[i] * x[i]; e2 += x[i + L] * x[i + L]; }
      var r = s / Math.sqrt(e1 * e2 + 1e-12); if (r > best) { best = r; bestL = L; }
    }
    return best > 0.55 ? sr / bestL : 0;
  }
  /* 1024点 FFT（ハン窓）。パワースペクトルを返す */
  var fftCos = null, fftSin = null, rev = null, hann = null;
  function fftInit() {
    fftCos = new Float32Array(FFT / 2); fftSin = new Float32Array(FFT / 2); rev = new Uint16Array(FFT); hann = new Float32Array(FFT);
    for (var i = 0; i < FFT / 2; i++) { fftCos[i] = Math.cos(2 * Math.PI * i / FFT); fftSin[i] = -Math.sin(2 * Math.PI * i / FFT); }
    var bits = Math.log2(FFT); for (var j = 0; j < FFT; j++) { var r = 0; for (var b = 0; b < bits; b++) r |= ((j >> b) & 1) << (bits - 1 - b); rev[j] = r; }
    for (var k = 0; k < FFT; k++) hann[k] = 0.5 - 0.5 * Math.cos(2 * Math.PI * k / (FFT - 1));
  }
  var re = new Float32Array(FFT), im = new Float32Array(FFT);
  function power(x, out) {
    for (var i = 0; i < FFT; i++) { re[rev[i]] = x[i] * hann[i]; im[rev[i]] = 0; }
    for (var size = 2; size <= FFT; size <<= 1) {
      var half = size >> 1, step = FFT / size;
      for (var s = 0; s < FFT; s += size) for (var k = 0; k < half; k++) {
        var a = s + k, b = a + half, c = fftCos[k * step], d = fftSin[k * step];
        var tr = re[b] * c - im[b] * d, ti = re[b] * d + im[b] * c;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
      }
    }
    for (var m = 0; m < FFT / 2; m++) out[m] = re[m] * re[m] + im[m] * im[m];
  }
  /* 音の処理側から 1024 サンプルずつ受け取る（画面が裏に回ってもタイマーのように間引かれない） */
  function onBlock(x) {
    if (!on) return;
    var e = 0; for (var i = 0; i < FFT; i++) e += x[i] * x[i];
    var rms = Math.sqrt(e / FFT);
    if (rms < noise * 2) noise = Math.max(0.0015, noise * 0.97 + rms * 0.03);   /* 周りの雑音の大きさを追う */
    if (rms < Math.max(noise * 3.5, 0.006)) return;
    var f0 = pitch(x, ctx.sampleRate); if (!f0) return;
    power(x, spec);
    var lm = new Float32Array(NM);
    for (var m = 0; m < NM; m++) { var w = melW[m], s = 0; for (var k = 0; k < FFT / 2; k++) if (w[k]) s += w[k] * spec[k]; lm[m] = Math.log(s + 1e-10); }
    var f = new Float32Array(D);
    for (var n = 0; n < NC; n++) { var c = 0; for (var j = 0; j < NM; j++) c += dct[n][j] * lm[j]; f[n] = c; }
    f[NC] = 12 * Math.log2(f0 / 100) / 3;      /* 声の高さ（半音を3で割って他と桁をそろえる） */
    frames.push(f); voicedN++;
    if (api.onVoiced) api.onVoiced();
    if (frames.length > 4000) frames.splice(0, 1000);
  }
  var WORKLET = "class P extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(1024);this.i=0;this.k=0}" +
    "process(inp){var x=inp[0]&&inp[0][0];if(x){for(var j=0;j<x.length;j++){this.b[this.i++]=x[j];if(this.i===1024){if((this.k++&1)===0)this.port.postMessage(this.b.slice());this.i=0}}}return true}}" +
    "registerProcessor('voice-feat',P);";
  async function open() {
    if (stream) return stream;
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
    spec = new Float32Array(FFT / 2); build(ctx.sampleRate); fftInit();
    var src = ctx.createMediaStreamSource(stream), sink = ctx.createGain(); sink.gain.value = 0; sink.connect(ctx.destination);
    if (ctx.audioWorklet) {
      var url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
      await ctx.audioWorklet.addModule(url);
      node = new AudioWorkletNode(ctx, 'voice-feat');
      node.port.onmessage = function (e) { onBlock(e.data); };
    } else {                                    /* 古いブラウザ向け */
      node = ctx.createScriptProcessor(1024, 1, 1);
      node.onaudioprocess = function (e) { onBlock(e.inputBuffer.getChannelData(0)); };
    }
    src.connect(node); node.connect(sink);
    return stream;
  }
  function close() { if (node) { try { node.disconnect(); } catch (e) {} node = null; } if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; if (ctx) ctx.close(); ctx = null; frames = []; }
  function take() { var f = frames; frames = []; return f; }
  function stats(fr) {
    var s = new Array(D).fill(0), q = new Array(D).fill(0);
    fr.forEach(function (f) { for (var d = 0; d < D; d++) { s[d] += f[d]; q[d] += f[d] * f[d]; } });
    var r = function (a) { return a.map(function (v) { return Math.round(v * 1000) / 1000; }); };

  function model(st, pooled) {
    var mu = [], v = [];
    for (var d = 0; d < D; d++) { mu[d] = st.s[d] / st.n; var x = st.q[d] / st.n - mu[d] * mu[d]; v[d] = Math.max(0.02, 0.8 * x + 0.2 * (pooled ? pooled[d] : x)); }

    fr.forEach(function (f) { var l = 0; for (var d = 0; d < D; d++) { var z = f[d] - md.mu[d]; l += z * z / md.v[d] + Math.log(md.v[d]); } tot += -0.5 * l; });

  function pooledVar(people) {
    var n = 0, s = new Array(D).fill(0), q = new Array(D).fill(0);
    people.forEach(function (p) { n += p.st.n; for (var d = 0; d < D; d++) { s[d] += p.st.s[d]; q[d] += p.st.q[d]; } });

    var pv = pooledVar(people), rs = people.map(function (p) { return { p: p, s: score(fr, model(p.st, pv)) }; }).sort(function (a, b) { return b.s - a.s; });

  /* 登録した声で「自分らしさ」の下限を決める（0.6秒ずつに区切って一番低い点より少し下） */
  function threshold(fr, st) {

  function add(a, b, sign) { return { n: a.n + sign * b.n, s: a.s.map(function (v, d) { return v + sign * b.s[d]; }), q: a.q.map(function (v, d) { return v + sign * b.q[d]; }) }; }
  var api = { onVoiced: null, open: open, close: close, track: function () { return stream ? stream.getAudioTracks()[0] : null; }, setOn: function (b) { on = b; if (!b) frames = []; },

  return api;
})();

/* ============================================================
   話す人（登録した声）。端末内に保存
   ============================================================ */
var People = [], unknownName = 'だれか';
function personOf(id) { for (var i = 0; i < People.length; i++) if (People[i].id === id) return People[i]; return null; }
function loadPeople() { return SpeakLib.all('speakers').then(function (a) { People = (a || []).sort(function (x, y) { return x.created - y.created; }); renderPeople(); }); }
function renderPeople() {
  var h = '';
  People.forEach(function (p) { h += '<span class="pchip"><i style="background:' + p.color + '"></i>' + esc(p.name) + '<button type="button" data-del="' + p.id + '" title="' + esc(p.name) + 'の声を消す" aria-label="' + esc(p.name) + 'の声を消す">×</button></span>'; });
  $('people').innerHTML = h || '<span class="faint">まだ誰も登録していません</span>';
  $('voiceOn').disabled = !People.length;
  if (!People.length) $('voiceOn').checked = false;
}
$('people').addEventListener('click', function (e) {
  var b = e.target.closest('[data-del]'); if (!b) return;
  var p = personOf(b.dataset.del); if (!p || !confirm(p.name + ' の声の登録を消しますか？（話した記録は残ります）')) return;
  SpeakLib.del('speakers', p.id).then(loadPeople);
});

/* 登録: 12秒ほど、表示した文を声に出して読んでもらう */
var ENROLL_SEC = 12;
$('enGo').addEventListener('click', async function () {
  var name = $('enName').value.trim();
  if (!name) { $('enMsg').textContent = '名前を入れてください'; $('enName').focus(); return; }
  if (listening) stopAll();
  var btn = this; btn.disabled = true; $('enMsg').textContent = '';
  try { await Voice.open(); } catch (e) { $('enMsg').textContent = 'マイクが使えません: ' + (e.message || e.name); btn.disabled = false; return; }
  Voice.take(); Voice.setOn(true);
  var t0 = Date.now();
  await new Promise(function (res) {
    var iv = setInterval(function () {
      var p = Math.min(1, (Date.now() - t0) / (ENROLL_SEC * 1000));
      $('enBar').style.width = (p * 100) + '%';
      if (p >= 1) { clearInterval(iv); res(); }
    }, 100);
  });
  var fr = Voice.take(); Voice.setOn(false);
  if (!listening) Voice.close();
  btn.disabled = false; $('enBar').style.width = '0';
  if (fr.length < 100) { $('enMsg').textContent = '声が少なすぎました（' + fr.length + '）。マイクに近づいて、もう一度読んでください'; return; }
  var st = Voice.stats(fr);
  var old = People.filter(function (p) { return p.name === name; })[0];
  var p = old || { id: 'p' + Date.now(), name: name, created: Date.now(), color: SpeakLib.COLORS[People.length % SpeakLib.COLORS.length] };
  p.st = old ? Voice.add(old.st, st, 1) : st;              /* 同じ名前ならもう一度読むほど正確になる */
  p.thr = Voice.threshold(fr, p.st);
  await SpeakLib.put('speakers', p);
  $('enMsg').textContent = name + ' の声を' + (old ? '追加で覚えました' : '覚えました') + '（' + fr.length + '）';
  $('enName').value = '';
  await loadPeople();
  $('voiceOn').checked = true; savePrefs();
});

/* ============================================================
   聞き取り（日本語）。話し続ける間は自動で再開する
   ============================================================ */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false, paused = false;
/* 速くするための仕組み
   ・Chrome が「文の終わり」と決めるまで（無音1秒以上）待たず、途中経過が COMMIT_MS 変わらなければ確定させて訳す
   ・読み上げ中はマイクを止めず「聞き流す」だけにする（止めて再起動すると時間がかかり、直後の発話も落ちるため） */
var COMMIT_MS = 1000;
var commitTimer = null, handledIdx = {}, ignoreBelow = 0, lastLen = 0, muted = false, liveSeq = 0, previewBusy = false, previewNext = null;
if (!SR) { note('このブラウザでは音声の聞き取りが使えません。Chrome・Edge（パソコン／Android）か iPhone の Safari で開いてください。下の欄に文字で入れれば訳と読み上げは使えます。'); $('mic').disabled = true; $('mic').classList.add('wait'); }

/* 二重に訳さないための確認
   ブラウザによっては（とくにスマホ）、①同じ確定結果を2回送る ②前の文を含めて送り直す ③聞き直した直後に前の文をもう一度返す
   ことがある。直近12秒に訳した文と比べ、同じ・含まれている → 捨てる、前の文で始まる → 続きの部分だけ訳す */
var recent = [];
function normJa(t) { return t.replace(/[\s、。，．,.!?！？「」『』…・]/g, ''); }
function cutPrefix(t, k) { var i = 0; while (i < t.length && k > 0) { if (normJa(t[i])) k--; i++; } return t.slice(i).trim(); }
function dedupe(t) {
  var n = normJa(t), now = Date.now(); if (!n) return '';
  recent = recent.filter(function (r) { return now - r.at < 12000; });
  for (var i = recent.length - 1; i >= 0; i--) {
    var r = recent[i];
    if (r.n === n || (n.length >= 4 && now - r.at < 6000 && r.n.indexOf(n) >= 0)) { dbg('二重なので捨てた: ' + t); return ''; }
    if (r.n.length >= 4 && n.indexOf(r.n) === 0) { var rest = cutPrefix(t, r.n.length); dbg('前の文を含んでいたので続きだけ: ' + rest); recent.push({ n: n, at: now }); return normJa(rest) ? rest : ''; }
  }
  recent.push({ n: n, at: now });
  return t;
}

function startRec() {
  if (!SR || rec) return;
  rec = new SR(); rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
  handledIdx = {}; ignoreBelow = 0; lastLen = 0; clearTimeout(commitTimer);
  dbg('聞き取り開始');
  rec.onresult = function (e) {
    lastLen = e.results.length; lastResultAt = Date.now(); voicedAtResult = Voice.voiced();
    if (!srWorked) { srWorked = true; saveSrMode(); }
    if (DEBUG) { var a = []; for (var k = e.resultIndex; k < e.results.length; k++) a.push(k + (e.results[k].isFinal ? '確' : '途') + ':' + e.results[k][0].transcript); dbg('ri=' + e.resultIndex + ' ' + a.join(' | ')); }
    if (muted) return;                                   /* 読み上げ中（スピーカーの英語を拾わない） */
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (i < ignoreBelow) continue;
      var t = e.results[i][0].transcript.trim();
      if (e.results[i].isFinal) {
        if (handledIdx[i]) continue;                     /* 同じ番号の確定結果がもう一度来た */
        handledIdx[i] = true;
        t = dedupe(t);
        if (t) handle(t, whoSpoke());
      } else interim += t;
    }
    clearTimeout(commitTimer);
    if (!interim) return;
    showLive(interim, null, true);
    livePreview(interim);
    var me = rec;
    commitTimer = setTimeout(function () {             /* 少し止まったら「ここで確定して」と頼む（文末の長い待ちを省く） */
      if (rec === me && !muted) { dbg('確定を依頼'); try { me.stop(); } catch (x) {} }   /* 確定 → onend ですぐ聞き直す */
    }, COMMIT_MS);
  };
  rec.onerror = function (e) {
    dbg('エラー ' + e.error);
    if (e.error === 'audio-capture' && Voice.isOpen()) { fallback('マイクを取り合っている'); return; }
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { note('マイクの使用が許可されていません。アドレスバーの鍵アイコンからマイクを「許可」にしてください。'); stopAll(); }
    else if (e.error !== 'no-speech' && e.error !== 'aborted') setState('聞き取りエラー: ' + e.error + '（自動で再開します）');
  };
  rec.onend = function () { dbg('聞き取り終了'); rec = null; if (listening) startRec(); };   /* 無音が続くと切れるので、すぐ再開 */
  /* 声で人を見分けるときは、同じマイクの音を聞き取りにも渡す（対応していないブラウザでは普通に始める） */
  var tr = srMode === 'track' ? Voice.track() : null;
  dbg('聞き取りの方式: ' + (tr ? 'マイクの音を渡す' : '聞き取りが自分でマイクを使う') + (Voice.isOpen() ? '（人の見分け: オン）' : '（人の見分け: オフ）'));
  try { if (tr) rec.start(tr); else rec.start(); }
  catch (e) { try { rec.start(); } catch (e2) { rec = null; } }
}
function stopRec() { if (rec) { var r = rec; rec = null; r.onend = null; try { r.abort(); } catch (e) {} } }
/* 聞き取りが動いていないときの立て直し
   声で人を見分けるためにマイクを開いていると、端末やブラウザによっては聞き取りに音が届かない（エラーも出ない）ことがある。
   「声は届いているのに5秒以上なにも聞き取れない」ときは、次の方式に切り替える:
     track（マイクの音を聞き取りに渡す）→ own（聞き取りが自分でマイクを使う）→ novoice（人の見分けを止めて聞き取りを優先）
   うまくいった方式は覚えておき、次回からそれで始める */
var srMode = 'track', srWorked = false, lastResultAt = 0, voicedAtResult = 0;
try { srMode = localStorage.getItem('speak.srMode') || 'track'; } catch (e) {}
function saveSrMode() { try { localStorage.setItem('speak.srMode', srMode); } catch (e) {} }
function fallback(why) {
  if (!listening) return;
  dbg('立て直し（' + why + '）: ' + srMode + ' → ' + (srMode === 'track' ? 'own' : 'novoice'));
  srWorked = false;
  if (srMode === 'track') srMode = 'own';
  else {
    srMode = 'novoice'; Voice.setOn(false); Voice.close();
    note('この端末では、声で人を見分ける機能と聞き取りを同時に使えないようです。聞き取りと翻訳を優先して、人の見分けを止めました。');
  }
  saveSrMode();
  stopRec(); resetWatch(); startRec();
}
function resetWatch() { lastResultAt = Date.now(); voicedAtResult = Voice.voiced(); }
/* 声が取れるたびに確かめる（タイマーは裏の画面で間引かれるので使わない） */
Voice.onVoiced = function () {
  if (!listening || muted || paused) return;
  if (Voice.voiced() - voicedAtResult > 40 && Date.now() - lastResultAt > 4000) fallback('声は届いているのに聞き取れない');
};

function stopAll() {
  listening = false; paused = false; muted = false; clearTimeout(commitTimer); stopRec();
  Voice.setOn(false); Voice.close();
  $('mic').classList.remove('on'); $('mic').textContent = '話す'; setState('止めました');
}
function whoSpoke() {
  if (!Voice.isOpen()) return null;
  var fr = Voice.take(), c = Voice.classify(fr, People);
  c.fs = fr.length >= 12 ? Voice.stats(fr) : null;
  dbg('声: ' + fr.length + 'コマ → ' + (c.sp ? personOf(c.sp).name : '不明') + ' (確からしさ ' + c.conf + ', 点 ' + (c.s ? c.s.toFixed(1) : '-') + ')');
  return c;
}

$('mic').addEventListener('click', async function () {
  if (listening) { stopAll(); return; }
  listening = true; this.classList.add('on'); this.textContent = '止める';
  setState('聞いています… 日本語で話してください');
  if ($('voiceOn').checked && People.length) {
    if (srMode === 'novoice') note('この端末では、声で人を見分ける機能と聞き取りを同時に使えなかったため、人の見分けは止めています（「声で人を見分ける」を一度外して付け直すと、もう一度試します）。');
    else try { await Voice.open(); Voice.take(); Voice.setOn(true); }
    catch (e) { note('声で人を見分けるためのマイクが使えませんでした（' + (e.message || e.name) + '）。聞き取りと翻訳はそのまま使えます。'); }
  }
  resetWatch(); startRec();
  Trans.prepare().then(function () { if (listening && !paused) setState('聞いています… 日本語で話してください'); });
});
TTS.onIdle(function () {
  if (!paused) return;
  paused = false;
  setTimeout(function () {                              /* 残響が消えるまで少し待ってから聞き直す */
    muted = false; ignoreBelow = lastLen;               /* 読み上げ中に拾った分は捨てる */
    Voice.take(); Voice.setOn(Voice.isOpen()); resetWatch();   /* 読み上げの声も捨てる */
    if (listening) { setState('聞いています… 日本語で話してください'); if (!rec) startRec(); }
  }, 250);
});

/* 話している途中も下訳を出す（前の下訳が終わってから最新の分だけ訳す） */
function livePreview(ja) {
  if (previewBusy) { previewNext = ja; return; }
  previewBusy = true;
  var seq = liveSeq;
  Trans.preview(ja).then(function (en) {
    if (en && seq === liveSeq) showLive(ja, en, true);
    previewBusy = false;
    if (previewNext) { var n = previewNext; previewNext = null; livePreview(n); }
  });
}

/* ============================================================
   1文ごとの処理: 訳す → 履歴に足す → 記録する → 読み上げる
   ============================================================ */
var items = [];
function showLive(ja, en, interim) {
  var h = '';
  if (ja) h += '<div class="ja' + (interim ? ' interim' : '') + '">' + esc(ja) + '</div>';
  if (en) h += '<div class="en">' + esc(en) + '</div>';
  if (h || !interim) $('live').innerHTML = h;
}
async function handle(ja, who) {
  liveSeq++; previewNext = null;
  showLive(ja, '…', false);
  var r0 = { ts: Date.now(), day: SpeakLib.dayKey(), ja: ja, en: '', via: '', sp: who ? who.sp : null, conf: who ? who.conf : 0, fs: who ? who.fs : null, voice: !!who };
  r0.up = r0.ts;
  var card = addCard(r0);
  try {
    var r = await Trans.translate(ja);
    r0.en = r.en; r0.via = r.via;
    card.querySelector('.en').textContent = r.en;
    card.querySelector('.via').textContent = r.via;
    showLive(ja, r.en, false);
    if ($('speakOn').checked) {
      if ($('pauseOn').checked && listening) { paused = true; muted = true; clearTimeout(commitTimer); Voice.setOn(false); setState('読み上げ中…'); }
      TTS.say(r.en, card.querySelector('.en'));
    }
  } catch (e) {
    card.querySelector('.en').innerHTML = '<span class="err">' + esc(e.message || '翻訳できませんでした') + '</span>';
  }
  if ($('recOn').checked) {
    try { r0.id = await SpeakLib.put('utt', r0); card.dataset.id = r0.id; } catch (e) { dbg('記録できませんでした: ' + e); }
  }
}
function chipHtml(r) {
  if (!r.voice && !r.sp) return '';
  var p = personOf(r.sp);
  return '<button type="button" class="who' + (r.sp && r.conf < 0.25 ? ' unsure' : '') + '" title="押すと話した人を直せます">' +
    '<i style="background:' + (p ? p.color : 'var(--faint)') + '"></i>' + esc(p ? p.name : (r.sp ? '削除した人' : unknownName)) + (r.sp && r.conf < 0.25 ? '？' : '') + '</button>';
}
function addCard(r) {
  var h = $('hist'); if (!items.length) h.innerHTML = '';
  var c = document.createElement('div'); c.className = 'card';
  c.innerHTML = '<div class="top">' + chipHtml(r) + '<span class="ja">' + esc(r.ja) + '</span></div><div class="row"><div class="en" role="button" tabindex="0">' + esc(r.en || '…') + '</div><span class="via">' + esc(r.via || '') + '</span></div>';
  c.querySelector('.en').addEventListener('click', function () { if (this.textContent && this.textContent !== '…') TTS.say(this.textContent, this); });
  c._rec = r;
  h.insertBefore(c, h.firstChild); items.push(c);
  return c;
}
/* 話した人の直し: チップを押すと、登録した人 → だれか → … の順に変わる。直した分の声は、その人の声として覚え足す */
$('hist').addEventListener('click', async function (e) {
  var b = e.target.closest('.who'); if (!b) return;
  var card = b.closest('.card'), r = card._rec; if (!r) return;
  var ids = People.map(function (p) { return p.id; }).concat([null]);
  var next = ids[(ids.indexOf(r.sp) + 1) % ids.length];
  if (r.fs && r.learned) { var old = personOf(r.learned); if (old) { old.st = Voice.add(old.st, r.fs, -1); await SpeakLib.put('speakers', old); } r.learned = null; }
  r.sp = next; r.conf = 1; r.up = Date.now();
  if (r.fs && next) { var np = personOf(next); if (np) { np.st = Voice.add(np.st, r.fs, 1); await SpeakLib.put('speakers', np); r.learned = next; } }
  if (r.id) await SpeakLib.put('utt', r);
  b.outerHTML = chipHtml(r);
});

$('typeForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var t = $('typeIn').value.trim(); if (!t) return;
  $('typeIn').value = '';
  await Trans.prepare();
  handle(t, null);
});
$('clear').addEventListener('click', function () { items = []; $('hist').innerHTML = '<p class="empty">画面から消しました（記録は「記録と統計」に残っています）</p>'; $('live').innerHTML = ''; });
$('speed').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  TTS.setSpeed(b.dataset.s);
});

/* 設定（この端末だけに覚える） */
function savePrefs() { try { localStorage.setItem('speak.prefs', JSON.stringify({ voiceOn: $('voiceOn').checked, recOn: $('recOn').checked })); } catch (e) {} }
(function () {
  var p = {}; try { p = JSON.parse(localStorage.getItem('speak.prefs') || '{}'); } catch (e) {}
  if (p.recOn === false) $('recOn').checked = false;
  $('voiceOn').checked = p.voiceOn !== false;
  $('voiceOn').addEventListener('change', function () { if (this.checked) { srMode = 'track'; srWorked = false; saveSrMode(); } savePrefs(); }); $('recOn').addEventListener('change', savePrefs);
})();

/* 調べもの用の記録（URL の末尾に ?debug=1 を付けると下に出る） */
var DEBUG = /[?&]debug=1/.test(location.search), dbgLines = [];
function dbg(t) {
  if (!DEBUG) return;
  var d = new Date(); dbgLines.push(('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2) + '.' + String(d.getMilliseconds()).padStart(3, '0').slice(0, 1) + ' ' + t);
  if (dbgLines.length > 300) dbgLines.shift();
  $('dbg').hidden = false; $('dbgLog').textContent = dbgLines.slice().reverse().join('\n');
}

/* 起動時: 登録した人と、今日の記録を出す */
loadPeople().then(function () {
  return SpeakLib.byDay(SpeakLib.dayKey());
}).then(function (rs) {
  (rs || []).sort(function (a, b) { return a.ts - b.ts; }).slice(-50).forEach(addCard);
}).catch(function (e) { note('記録を読み込めませんでした（' + (e && e.message || e) + '）。プライベートブラウズでは記録できません。'); });
</script>
