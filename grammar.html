<html lang="ja">
<head>

<title>文法1000本ノック 意味ドリル</title>
<meta name="description" content="文法問題集1000本ノックのメモ（unknown）から、英語の語句を見て日本語の意味を答えるドリル。例文は問題集の問題文。苦手なものほどよく出る。">
<style>

    --accent: #7FA6DC; --accent-tint: #1D2941; --rule: #2C313B; --rule-soft: #232830;

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-jp); line-height: 1.6; }

  header a { color: var(--accent); }

  .bar select { font: inherit; font-size: .88rem; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 100%; }

  .rng button, .seqbar button { font: inherit; font-size: .8rem; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }

  .seqbar[hidden] { display: none; }
  .seqbar input { font: inherit; font-size: .85rem; width: 5.2em; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .exja { font-size: .92rem; color: var(--muted); background: var(--paper); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 6px 10px; margin: -4px 0 10px; }
  .exja[hidden] { display: none; }
  .exja b { color: var(--faint); font-weight: 400; font-size: .75rem; margin-right: 6px; }

  .status { font-size: .82rem; color: var(--faint); margin: 0 0 10px; }

  .tag.weak { color: var(--ng); border-color: var(--ng); }

  .rel { font-size: .85rem; color: var(--muted); font-family: var(--font-jp); font-weight: 400; margin-right: 6px; }
  .ex { font-family: var(--font-en); font-size: 1.05rem; line-height: 1.85; background: var(--paper); border-radius: 10px; padding: 8px 12px; margin: 6px 0 10px; }
  .ex mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }

  .iconbtn.on { background: var(--ng); color: #fff; border-color: var(--ng); }

  .kbd { font-size: .72rem; color: var(--faint); margin-left: auto; align-self: center; }

  .verdict.ng { background: var(--ng-tint); color: var(--ng); }
  .lbl { font-size: .75rem; color: var(--faint); margin: 10px 0 2px; }
  .answer { font-size: 1.15rem; font-weight: 700; }
  .yours { font-size: 1rem; }
  .note { font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .fix { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: .8rem; color: var(--muted); align-items: center; }

  .wl .cnt { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: .78rem; color: var(--ng); font-variant-numeric: tabular-nums; }
  .wl button { font: inherit; font-size: .78rem; background: none; border: 0; color: var(--accent); cursor: pointer; text-decoration: underline; padding: 0; }
  .tools { margin-top: 14px; font-size: .8rem; color: var(--faint); display: flex; gap: 12px; flex-wrap: wrap; }
  .tools button { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  @media (max-width: 480px) { .phrase { font-size: 1.25rem; } .kbd { display: none; } .card { padding: 14px; } }

</head>

<div class="wrap">
<header>

  <p>問題集のメモ（unknown）から出題します。<b>英語の語句と問題集の例文を見て、日本語の意味を書くか🎤で言って</b>ください。答え合わせで例文の訳も出ます。

</div>
<div class="seqbar" id="seqbar" hidden>次は <b id="seqNext"></b>　<label>No.<input id="seqJump" type="number" min="1" max="1049" inputmode="numeric"></label><button type="button" id="seqGo">から始める</button><button type="button" id="seqTop">範囲のはじめに戻る</button></div>
<p class="status" id="status"></p>
<p class="help" id="help" hidden></p>
<div class="score" id="score"></div>

<div id="stage"></div>

<details class="box" id="weakBox">

  <ul class="wl" id="weakList"></ul>

<details class="box" id="mastBox">

  <ul class="wl" id="mastList"></ul>
</details>
<div class="tools">

</div>

var PH = /^(a|b|c|s|v|x|o|sv|v-ing|～|〜|~|…|oneself|one's)$/i;
function enToks(en) {
  return en.replace(/<[^>]*>/g, ' ').replace(/\[[^\]]*\]/g, function (m) { return ' ' + m.slice(1, -1).replace(/\//g, ' ') + ' '; })
    .replace(/\([^)]*\)/g, ' ').toLowerCase().split(/[\s\/,]+/).filter(function (t) { return t && !PH.test(t) && /[a-z]/.test(t); })
    .map(function (t) { return t.replace(/[^a-z'-]/g, ''); }).filter(Boolean);
}
function stem(w) { w = w.toLowerCase().replace(/[^a-z]/g, ''); return w.length > 5 ? w.slice(0, w.length - 2) : w.length > 3 ? w.slice(0, 4) : w; }
function markEx(ex, en) {
  var keys = enToks(en), big = keys.filter(function (k) { return k.length >= 4; }).map(stem), small = keys.filter(function (k) { return k.length < 4; });
  var parts = ex.split(/(\[[^\]]*\]|\s+)/).filter(function (p) { return p !== ''; });
  var hit = parts.map(function (p) {
    if (/^\s+$/.test(p)) return false;
    var w = p.replace(/^\[|\]$/g, '').toLowerCase().replace(/[^a-z' -]/g, '');
    return w.split(/\s+/).some(function (x) { return x && big.some(function (s) { return x.indexOf(s) === 0; }); });
  });
  /* 短い語（of / to / in など）は、印の付いた語のすぐ近くにあるときだけ */
  parts.forEach(function (p, i) {
    if (hit[i] || /^\s+$/.test(p)) return;
    var w = p.replace(/^\[|\]$/g, '').toLowerCase().replace(/[^a-z']/g, '');
    if (!w || small.indexOf(w) < 0) return;
    for (var d = 1; d <= 6; d++) { if ((hit[i - d] === true) || (hit[i + d] === true)) { hit[i] = 'near'; return; } }
  });
  if (!big.length && small.length) parts.forEach(function (p, i) { var w = p.toLowerCase().replace(/[^a-z']/g, ''); if (w && small.indexOf(w) >= 0) hit[i] = true; });
  return parts.map(function (p, i) {
    var isAns = /^\[.*\]$/.test(p), t = esc(isAns ? p.slice(1, -1) : p);
    if (isAns) t = '<span class="ans">' + t + '</span>';
    return hit[i] ? '<mark>' + t + '</mark>' : t;
  }).join('');
}

/* ============ 採点（日本語なので「だいたい合っているか」を見る。最終判定は自分で直せる） ============ */
function jnorm(s) {
  return String(s).replace(/<[^>]*>|＜[^＞]*＞/g, '').replace(/[A-Za-zＡ-Ｚａ-ｚ]/g, '')
    .replace(/[\s　、。,.・：:；;！!？?「」『』（）()\[\]【】〈〉～〜~…\-ー―＝=→←≒％%0-9０-９〇]/g, '')
    .replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); });
}
function jaAlts(ja) {
  var base = ja.replace(/※.*$/, '');
  var list = [base, base.replace(/（[^）]*）|\([^)]*\)/g, '')];
  base.split(/[、，,／\/]|(?:\s+)/).forEach(function (p) { if (p.trim()) { list.push(p); list.push(p.replace(/（[^）]*）|\([^)]*\)/g, '')); } });
  /* 「SがVすると示す」→「示す」のように、最後の漢字から後ろの中心部分も */
  list.slice().forEach(function (p) { var m = p.replace(/※.*$/, '').trim().match(/[一-鿿々ァ-ヶー]+[ぁ-ん]*$/); if (m && m[0].length >= 2) list.push(m[0]); });
  /* 「～する」「～な」などの語尾を外した形も */
  list.slice().forEach(function (p) { var q = p.replace(/(する|される|させる|な|に|の|だ|である|している)$/, ''); if (q !== p) list.push(q); });
  return list.map(jnorm).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
}
function bigrams(s) { var b = []; if (s.length === 1) return [s]; for (var i = 0; i < s.length - 1; i++) b.push(s.substr(i, 2)); return b; }
function dice(a, b) {
  var A = bigrams(a), B = bigrams(b), used = {}, m = 0;
  A.forEach(function (x) { for (var j = 0; j < B.length; j++) if (!used[j] && B[j] === x) { used[j] = 1; m++; break; } });
  return 2 * m / (A.length + B.length || 1);
}
function judgeJa(user, ja) {
  var u = jnorm(user); if (!u) return 'x';
  var best = 0;
  jaAlts(ja).forEach(function (a) {
    var sc = dice(u, a);
    if (a.length >= 2 && (u.indexOf(a) >= 0 || (u.length >= 2 && a.indexOf(u) >= 0 && u.length >= a.length * 0.5))) sc = Math.max(sc, 0.9);
    var kj = (a.match(/[一-鿿]/g) || []).filter(function (c, i, x) { return x.indexOf(c) === i; });
    if (kj.length >= 2) { var hitk = kj.filter(function (c) { return u.indexOf(c) >= 0; }).length; if (hitk === kj.length) sc = Math.max(sc, 0.7); else if (hitk * 2 >= kj.length) sc = Math.max(sc, 0.4); }
    best = Math.max(best, sc);
  });
  return best >= 0.6 ? 'o' : best >= 0.3 ? 'n' : 'x';
}

function record(it, r, user) {
  var s = stat(it.key); s.n++; s.h = (s.h + r).slice(-10);
  if (r === 'o') s.ok++; else if (r === 'n') s.near++; else s.ng++;

  save();
}
function regrade(it, r) {   /* 直前の判定を自分で直す */
  var s = stat(it.key), last = s.log[s.log.length - 1]; if (!last || last[1] === r) return;
  var old = last[1]; if (old === 'o') s.ok--; else if (old === 'n') s.near--; else s.ng--;
  if (r === 'o') s.ok++; else if (r === 'n') s.near++; else s.ng++;
  last[1] = r; s.h = s.h.slice(0, -1) + r; save();
}

/* ============ 出題 ============ */
var NOS = Object.keys(BYNO).map(Number).sort(function (a, b) { return a - b; });
var RNG = [1, 1049];
(function () {
  var r = lsGet('range', ''); if (r) { var p = String(r).split('-'); RNG = [+p[0] || 1, +p[1] || 1049]; }
  $('rFrom').value = RNG[0]; $('rTo').value = RNG[1]; $('mode').value = lsGet('mode', 'auto');
})();
function clampNo(v, d) { v = parseInt(v, 10); if (isNaN(v)) return d; return Math.max(1, Math.min(1049, v)); }
function setRange() {
  var a = clampNo($('rFrom').value, 1), b = clampNo($('rTo').value, 1049); if (a > b) { var t = a; a = b; b = t; }
  $('rFrom').value = a; $('rTo').value = b;
  if (a === RNG[0] && b === RNG[1]) return;
  RNG = [a, b]; lsSet('range', a + '-' + b); seqNo = a - 1; lsSet('seqNo', seqNo); next();
}
function inRange(it) { return it.no >= RNG[0] && it.no <= RNG[1]; }
var seqNo = lsGet('seqNo', 0);
function pool() {
  var mode = $('mode').value;
  return ITEMS.filter(function (it) {
    if (!inRange(it)) return false;
    if (mode === 'seq') return true;
    var s = stat(it.key);
    if (mode === 'mastered') return isMastered(s);
    if (isMastered(s)) return false;
    if (mode === 'onlyweak') return isWeak(s);
    if (mode === 'new') return s.n === 0;
    return true;
  });
}
function weight(it) {
  var s = stat(it.key), mode = $('mode').value;
  if (mode === 'flat' || mode === 'mastered' || mode === 'new') return 1;
  if (mode === 'auto' && s.n === 0) return 6;
  var w = 1 + 4 * (s.ng + 0.5 * s.near + 0.5) / (s.n + 1);
  if (isWeak(s)) w += 2;
  return w;
}
var recent = lsGet('recent', []);
function pickGroup() {
  var p = pool(); if (!p.length) return [];
  if ($('mode').value === 'seq') {
    var nos = p.map(function (it) { return it.no; }), nx = nos.filter(function (n) { return n > seqNo; });
    var no = nx.length ? Math.min.apply(null, nx) : Math.min.apply(null, nos);
    if (!nx.length && seqNo >= RNG[0]) note('範囲の最後まで終わったので、はじめ（No.' + pad4(no) + '）に戻りました。');
    return p.filter(function (it) { return it.no === no; }).slice(0, GROUP_MAX);
  }
  var cand = p.filter(function (it) { return recent.indexOf(it.no) < 0; }); if (!cand.length) cand = p;
  var tot = 0, ws = cand.map(function (it) { var w = weight(it); tot += w; return w; }), r = Math.random() * tot, head = cand[0];
  for (var i = 0; i < cand.length; i++) { r -= ws[i]; if (r <= 0) { head = cand[i]; break; } }
  var inPool = p.filter(function (it) { return it.no === head.no; });
  recent.push(head.no); recent = recent.slice(-Math.min(30, Math.floor(NOS.length / 2))); lsSet('recent', recent);
  return inPool.slice(0, GROUP_MAX);
}

var cur = [], answered = false, sess = { n: 0, o: 0, x: 0 };
var MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function next() {
  note('');
  cur = pickGroup(); answered = false;
  var st = $('stage');
  if (!cur.length) { st.innerHTML = '<div class="card empty">この条件で出せる問題がありません。出し方や問題番号の範囲を変えてください。</div>'; updateStatus(); return; }
  var no = cur[0].no, ex = cur[0].ex;
  var h = '<div class="card">';
  if (cur.length > 1) h += '<div class="grouphd">No.' + pad4(no) + ' の語句 ' + cur.length + ' つをまとめて出しています。</div>';
  h += '<div class="ex-src">問題集 No.' + pad4(no) + ' の例文 <button type="button" id="say">▶ 読み上げ</button></div>';
  h += '<div class="ex" id="exbox">' + markEx(ex, cur.map(function (it) { return it.en; }).join(' ')) + '</div>';
  h += '<div class="exja" id="exja" hidden><b>訳</b>' + esc(DATA.knockJa[no] || '（訳がありません）') + '</div>';
  cur.forEach(function (it, i) {
    var s = stat(it.key);
    h += '<div class="q" id="q' + i + '"><div class="meta">' + (cur.length > 1 ? '<span class="qn">' + (i + 1) + '</span>' : '') +
      (s.n ? '<span class="tag' + (isWeak(s) ? ' weak' : '') + '">' + s.n + '回目' + (isWeak(s) ? '・苦手' : '') + '</span>' : '<span class="tag">はじめて</span>') + '</div>' +
      '<div class="phrase">' + (it.rel ? '<span class="rel">' + esc(it.rel) + '</span>' : '') + esc(it.en) + (sayText(it.en) ? '<button type="button" class="say" id="sayp' + i + '" aria-label="読み上げ">▶ 読む</button>' : '') + '</div>' +
      '<div class="inrow"><input id="ans' + i + '" placeholder="日本語の意味" autocomplete="off" enterkeyhint="' + (i < cur.length - 1 ? 'next' : 'done') + '">' +
      '<button class="iconbtn" id="mic' + i + '" type="button" aria-label="声で答える">' + MIC + '</button></div>' +
      '<div id="res' + i + '"></div></div>';
  });
  h += '<div class="acts" id="qacts"><button class="primary" id="btnCheck">答え合わせ</button><button id="btnGive">わからない</button><span class="kbd">Enter で次の欄・最後の欄で答え合わせ</span></div>';
  h += '<div class="acts" id="nacts" hidden><button class="primary" id="btnNext">次の問題</button></div></div>';
  st.innerHTML = h;
  $('say').onclick = function () { speak(plainEx(ex)); };
  cur.forEach(function (it, i) {
    var inp = $('ans' + i);
    inp.onkeydown = function (e) {
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      e.preventDefault(); if (i < cur.length - 1) $('ans' + (i + 1)).focus(); else check(false);
    };
    $('mic' + i).onclick = function () { startRecog(inp, this); };
    if ($('sayp' + i)) $('sayp' + i).onclick = function () { speak(sayText(it.en)); };
  });
  $('btnCheck').onclick = function () { check(false); };
  $('btnGive').onclick = function () { check(true); };
  $('btnNext').onclick = next;
  if (!('ontouchstart' in window)) $('ans0').focus();
  updateStatus(); updateSeq();
}
var VTXT = { o: '○ 正解', n: '△ おしい', x: '× 不正解' }, VCLS = { o: 'ok', n: 'near', x: 'ng' };
function check(giveup) {
  if (answered) return; answered = true;
  if (recogOn) recog.stop();
  cur.forEach(function (it, i) {
    var user = giveup ? '' : $('ans' + i).value.trim(), r = giveup ? 'x' : judgeJa(user, it.ja);
    $('ans' + i).disabled = true;
    record(it, r, user); sess.n++; if (r === 'o') sess.o++; else if (r === 'x') sess.x++;
    showResult(it, i, r, user);
  });
  $('exja').hidden = false;
  if ($('mode').value === 'seq') { seqNo = cur[0].no; lsSet('seqNo', seqNo); }
  $('qacts').hidden = true; $('nacts').hidden = false; $('btnNext').focus();
  updateStatus(); renderLists();
}
function showResult(it, i, r, user) {
  var h = '<div class="result"><span class="verdict ' + VCLS[r] + '">' + VTXT[r] + '</span>' +
    '<div class="lbl">意味</div><div class="answer">' + esc(it.ja) + '</div>' +
    (it.note ? '<div class="note">※ ' + esc(it.note) + '</div>' : '') +
    (user ? '<div class="lbl">あなたの答え</div><div class="yours">' + esc(user) + '</div>' : '') +
    '<div class="fix">判定を直す: ' +
    ['o', 'n', 'x'].map(function (k) { return '<button type="button" data-k="' + k + '"' + (k === r ? ' disabled' : '') + '>' + VTXT[k].split(' ')[0] + 'にする</button>'; }).join('') + '</div>' +
    histHtml(it) + '</div>';
  var box = $('res' + i); box.innerHTML = h;
  [].forEach.call(box.querySelectorAll('.fix button'), function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-k'); regrade(it, k);
      if (r === 'o') sess.o--; else if (r === 'x') sess.x--; if (k === 'o') sess.o++; else if (k === 'x') sess.x++;
      showResult(it, i, k, user); updateStatus(); renderLists();
    };
  });
}
function histHtml(it) {
  var s = stat(it.key); if (!s.log.length) return '';
  return '<div class="hist">これまで: ' + s.log.slice(-8).map(function (l) {
    return '<span class="' + (l[1] === 'o' ? 'o' : l[1] === 'n' ? 'n' : 'x') + '">' + (l[1] === 'o' ? '○' : l[1] === 'n' ? '△' : '×') + '</span>' + fmtTime(l[0]);
  }).join('　') + '</div>';
}
function updateSeq() {
  var on = $('mode').value === 'seq'; $('seqbar').hidden = !on; if (!on) return;
  $('seqNext').textContent = cur.length ? 'No.' + pad4(cur[0].no) + '（範囲 ' + RNG[0] + '〜' + RNG[1] + '）' : '';
}
function updateStatus() {
  var all = ITEMS.filter(inRange), seen = all.filter(function (it) { return stat(it.key).n > 0; }).length;
  var mast = all.filter(function (it) { return isMastered(stat(it.key)); }).length;
  $('status').textContent = '全 ' + all.length + ' 語句（問題 ' + NOS.filter(function (n) { return inRange({ no: n }); }).length + ' 問分）・出題済み ' + seen + '・一発正解 ' + mast + '・今出せるもの ' + pool().length;
  $('score').innerHTML = '<span>今回 <b>' + sess.n + '</b> 問</span><span class="ok">○ <b>' + sess.o + '</b></span><span class="ng">× <b>' + sess.x + '</b></span>';
}
function renderLists() {
  var weak = ITEMS.filter(function (it) { return isWeak(stat(it.key)); }).sort(function (a, b) { return stat(b.key).ng - stat(a.key).ng; });
  $('weakCnt').textContent = '（' + weak.length + '）';
  $('weakList').innerHTML = weak.map(function (it) {
    var s = stat(it.key);
    return '<li><span class="en">' + esc(it.en) + ' <small>No.' + pad4(it.no) + '</small></span><span class="jp">' + esc(it.ja) + '</span><span class="cnt">×' + s.ng + (s.near ? ' △' + s.near : '') + ' / ' + s.n + '回</span></li>';
  }).join('') || '<li><span class="jp">まだありません。</span></li>';
  var mast = ITEMS.filter(function (it) { return isMastered(stat(it.key)); });
  $('mastCnt').textContent = '（' + mast.length + '）';
  $('mastList').innerHTML = mast.map(function (it) {
    return '<li><span class="en">' + esc(it.en) + ' <small>No.' + pad4(it.no) + '</small></span><span class="jp">' + esc(it.ja) + '</span><span class="cnt"><button data-k="' + esc(it.key) + '">出題に戻す</button></span></li>';
  }).join('') || '<li><span class="jp">まだありません。</span></li>';
  [].forEach.call($('mastList').querySelectorAll('button'), function (b) { b.onclick = function () { stat(b.getAttribute('data-k')).back = true; save(); renderLists(); updateStatus(); }; });
}

$('rFrom').onchange = setRange; $('rTo').onchange = setRange;
[$('rFrom'), $('rTo')].forEach(function (el) { el.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); setRange(); } }; });
$('rAll').onclick = function () { $('rFrom').value = 1; $('rTo').value = 1049; setRange(); };
$('mode').onchange = function () { lsSet('mode', this.value); next(); };
$('seqGo').onclick = function () { var v = clampNo($('seqJump').value, NaN); if (isNaN(v)) return; if (v < RNG[0] || v > RNG[1]) { note('No.' + v + ' は範囲（' + RNG[0] + '〜' + RNG[1] + '）の外です。'); return; } seqNo = v - 1; lsSet('seqNo', seqNo); next(); };
$('seqJump').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('seqGo').click(); } };
$('seqTop').onclick = function () { seqNo = RNG[0] - 1; lsSet('seqNo', seqNo); next(); };
$('btnExport').onclick = function () {
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ stat: ST }, null, 1)], { type: 'application/json' }));
  a.download = 'grammar1000-record-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
};
$('btnImport').onclick = function () { $('importFile').click(); };
$('importFile').onchange = function () {
  var f = this.files[0]; if (!f) return; var rd = new FileReader();
  rd.onload = function () { try { var d = JSON.parse(rd.result); if (!d.stat) throw 0; ST = d.stat; save(); renderLists(); next(); note('記録を読み込みました。'); } catch (e) { note('読み込めませんでした。書き出したファイルを選んでください。'); } };
  rd.readAsText(f);
};
$('btnReset').onclick = function () { if (!confirm('この端末の解答記録をすべて消します。よろしいですか？')) return; ST = {}; save(); recent = []; lsSet('recent', []); sess = { n: 0, o: 0, x: 0 }; renderLists(); next(); };
renderLists(); next();
</script>
